## Experiment A：单层隔离实验

“逐层用 C 输出作为输入”方案

**“这一层 Python 实现本身和 C 实现之间的误差”**

多项式=C低精度
torch.sigmoid/tanh=py高精度
sigmoid/tanh_approx=py低精度

最大绝对误差

sigmoid C 高精度是基准， py 高精度 误差 1e-8， C低精度 1e-4， py 低精度 1e-5
tanh C 高精度是基准， py 高精度 误差 1e-8， C低精度 1e-4， py 低精度 1e-5


